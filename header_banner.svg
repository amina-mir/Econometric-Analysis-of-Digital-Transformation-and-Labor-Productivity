<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="460" viewBox="0 0 1600 460" role="img" aria-labelledby="title desc">
  <title id="title">Digital Transformation and Labor Productivity</title>
  <desc id="desc">Bannière illustrant la transformation numérique, l'analyse économétrique et la productivité du travail dans quinze pays de l'Union européenne entre 2010 et 2023.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07152f"/>
      <stop offset="55%" stop-color="#102b52"/>
      <stop offset="100%" stop-color="#123b58"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#36d6c4"/>
      <stop offset="100%" stop-color="#72a7ff"/>
    </linearGradient>
    <linearGradient id="bars" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#72a7ff" stop-opacity=".95"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#b8d6ff" stroke-opacity=".075" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="460" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="460" rx="28" fill="url(#grid)"/>
  <circle cx="1500" cy="15" r="260" fill="#2dd4bf" opacity=".07"/>
  <circle cx="1320" cy="460" r="300" fill="#648cff" opacity=".09"/>
  <path d="M0 390 C300 320 480 470 780 390 S1260 280 1600 360" fill="none" stroke="#48dcca" stroke-opacity=".16" stroke-width="2"/>
  <path d="M0 414 C320 344 510 490 820 412 S1280 310 1600 386" fill="none" stroke="#8bb6ff" stroke-opacity=".13" stroke-width="2"/>

  <!-- Left-side title -->
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="88" y="72" width="330" height="38" rx="19" fill="#173e5f" stroke="#52ddca" stroke-opacity=".55"/>
    <circle cx="110" cy="91" r="5" fill="#4ee3d0"/>
    <text x="128" y="97" fill="#c4f7f0" font-size="16" font-weight="700" letter-spacing="2.2">ÉCONOMÉTRIE · DONNÉES DE PANEL</text>

    <text x="86" y="190" fill="#ffffff" font-size="58" font-weight="800" letter-spacing="-1.5">Digital Transformation</text>
    <text x="86" y="260" fill="#ffffff" font-size="58" font-weight="800" letter-spacing="-1.5">&amp; Labor Productivity</text>
    <rect x="90" y="292" width="112" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="88" y="340" fill="#c4d8ee" font-size="24" font-weight="500">Internet · Haut débit · Productivité du travail</text>
    <text x="88" y="386" fill="#83a9cd" font-size="18" font-weight="600" letter-spacing="2.4">UNION EUROPÉENNE  /  2010—2023  /  15 PAYS</text>
  </g>

  <!-- Right-side analytics card -->
  <g transform="translate(1030 75)">
    <rect x="0" y="0" width="480" height="300" rx="22" fill="#0a1e39" fill-opacity=".78" stroke="#8ebaff" stroke-opacity=".24"/>
    <text x="32" y="42" fill="#9bb8d8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2">PRODUCTIVITY INDEX</text>
    <g stroke="#85a8cb" stroke-opacity=".16" stroke-width="1">
      <path d="M32 82H448M32 132H448M32 182H448M32 232H448"/>
      <path d="M82 65V250M162 65V250M242 65V250M322 65V250M402 65V250"/>
    </g>
    <g fill="url(#bars)">
      <rect x="55" y="185" width="34" height="65" rx="6"/>
      <rect x="112" y="164" width="34" height="86" rx="6"/>
      <rect x="169" y="145" width="34" height="105" rx="6"/>
      <rect x="226" y="126" width="34" height="124" rx="6"/>
      <rect x="283" y="105" width="34" height="145" rx="6"/>
      <rect x="340" y="83" width="34" height="167" rx="6"/>
    </g>
    <path d="M72 160 C112 150 126 143 186 125 S266 102 300 92 S354 70 405 62" fill="none" stroke="#53e0cc" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
    <g fill="#d7fff8" stroke="#40d9c5" stroke-width="3">
      <circle cx="72" cy="160" r="6"/><circle cx="186" cy="125" r="6"/><circle cx="300" cy="92" r="6"/><circle cx="405" cy="62" r="6"/>
    </g>
    <g fill="#8caac9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">
      <text x="51" y="276">2010</text><text x="384" y="276">2023</text>
    </g>
    <g transform="translate(394 24)">
      <circle cx="16" cy="16" r="16" fill="#153c56" stroke="#4adbc8" stroke-opacity=".7"/>
      <path d="M8 16h16M16 8v16" stroke="#66e6d4" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>
  <text x="1510" y="430" text-anchor="end" fill="#7f9fbe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" letter-spacing="1.8">R  ·  PLM  ·  GGPLOT2</text>
</svg>
