<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="50%" stop-color="#1c2541" />
      <stop offset="100%" stop-color="#0b132b" />
    </linearGradient>

    <!-- Accent Gradient (Cyan to Gold) -->
    <linearGradient id="cyanGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00b4d8" />
      <stop offset="50%" stop-color="#48cae4" />
      <stop offset="100%" stop-color="#ffb703" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2a385b" stroke-width="0.6" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)" />
  <rect width="1200" height="400" fill="url(#grid)" />

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="5" fill="url(#cyanGold)" />

  <!-- Left Side: Econometric / Digital Visual Graphics -->
  <g transform="translate(60, 50)">

    <!-- Digital Network Waves (Broadband) -->
    <path d="M10 260 Q 90 210, 170 240 T 330 200 T 490 220" fill="none" stroke="#00b4d8" stroke-width="2" opacity="0.3"/>
    <path d="M10 240 Q 90 190, 170 220 T 330 170 T 490 190" fill="none" stroke="#48cae4" stroke-width="3" opacity="0.6"/>
    <path d="M10 220 Q 90 170, 170 200 T 330 140 T 490 160" fill="none" stroke="#90e0ef" stroke-width="1.5" opacity="0.4"/>

    <!-- Panel Axes -->
    <line x1="50" y1="250" x2="450" y2="250" stroke="#4a5568" stroke-width="2" />
    <line x1="50" y1="50" x2="50" y2="250" stroke="#4a5568" stroke-width="2" />

    <!-- Trend Lines (Panel Data - Multiple Countries i = 1..15) -->
    <path d="M 50 210 Q 120 190, 200 170 T 350 120 T 430 80" fill="none" stroke="#ffb703" stroke-width="3.5" filter="url(#glow)"/>
    <path d="M 50 230 Q 130 210, 210 190 T 340 150 T 430 110" fill="none" stroke="#00b4d8" stroke-width="2.5" opacity="0.85"/>
    <path d="M 50 220 Q 110 200, 190 185 T 330 135 T 430 95" fill="none" stroke="#e63946" stroke-dasharray="4,4" stroke-width="2" opacity="0.75"/>

    <!-- Data Nodes -->
    <circle cx="50" cy="210" r="4" fill="#ffb703"/>
    <circle cx="200" cy="170" r="4" fill="#ffb703"/>
    <circle cx="350" cy="120" r="4" fill="#ffb703"/>
    <circle cx="430" cy="80" r="6" fill="#ffb703" filter="url(#glow)"/>

    <circle cx="210" cy="190" r="4" fill="#00b4d8"/>
    <circle cx="340" cy="150" r="4" fill="#00b4d8"/>
    <circle cx="430" cy="110" r="5" fill="#00b4d8"/>

    <!-- Equation Badge / Formula Highlight -->
    <rect x="230" y="22" width="200" height="38" rx="8" fill="#1c2541" stroke="#48cae4" stroke-width="1.5" opacity="0.95"/>
    <text x="330" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#48cae4" font-weight="bold" text-anchor="middle">
      Y<tspan font-size="10" dy="3">it</tspan><tspan font-size="14" dy="-3"> = α + βX</tspan><tspan font-size="10" dy="3">it</tspan><tspan font-size="14" dy="-3"> + μ<tspan font-size="10" dy="3">i</tspan><tspan font-size="14" dy="-3"> + ε<tspan font-size="10" dy="3">it</tspan></text>
  </g>

  <!-- Right Side: Project Title & Information -->
  <g transform="translate(560, 0)">

    <!-- Subtitle Pill -->
    <rect x="0" y="65" width="235" height="28" rx="14" fill="#003566"/>
    <text x="117" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#48cae4" font-weight="600" text-anchor="middle" letter-spacing="1">
      DONNÉES DE PANEL (UE 2010–2023)
    </text>

    <!-- Main Heading -->
    <text x="0" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" fill="#ffffff" font-weight="bold">
      Internet, Haut Débit &amp;
    </text>
    <text x="0" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" fill="#00b4d8" font-weight="bold">
      Productivité du Travail
    </text>

    <!-- Methodology Line -->
    <text x="0" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#94a3b8" font-weight="400">
      Modèles RE/FE • Test d'Hausman • Erreurs Robustes HAC
    </text>

    <!-- Feature Bullet Cards -->
    <g transform="translate(0, 240)">
      <!-- Item 1 -->
      <rect x="0" y="0" width="270" height="34" rx="6" fill="#1c2541" stroke="#2a385b" stroke-width="1"/>
      <circle cx="20" cy="17" r="5" fill="#00b4d8"/>
      <text x="35" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#e2e8f0" font-weight="500">15 Pays UE (Panel WDI)</text>

      <!-- Item 2 -->
      <rect x="285" y="0" width="270" height="34" rx="6" fill="#1c2541" stroke="#2a385b" stroke-width="1"/>
      <circle cx="305" cy="17" r="5" fill="#ffb703"/>
      <text x="320" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#e2e8f0" font-weight="500">Package R: plm &amp; ggplot2</text>

      <!-- Item 3 -->
      <rect x="0" y="44" width="270" height="34" rx="6" fill="#1c2541" stroke="#2a385b" stroke-width="1"/>
      <circle cx="20" cy="61" r="5" fill="#48cae4"/>
      <text x="35" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#e2e8f0" font-weight="500">Effets Aléatoires Retenus</text>

      <!-- Item 4 -->
      <rect x="285" y="44" width="270" height="34" rx="6" fill="#1c2541" stroke="#2a385b" stroke-width="1"/>
      <circle cx="305" cy="61" r="5" fill="#e63946"/>
      <text x="320" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#e2e8f0" font-weight="500">Correction HAC d'Arellano</text>
    </g>

    <!-- Author Line -->
    <text x="0" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b">
      Auteure : <tspan fill="#48cae4" font-weight="600">Amina Mir</tspan> — Master Économie Appliquée &amp; Data Science
    </text>
  </g>

</svg>
